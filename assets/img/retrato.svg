<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Marcador de posición: aquí va la foto de la psicóloga">
  <defs>
    <clipPath id="c"><rect width="800" height="1000"/></clipPath>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EADCC6"/>
      <stop offset="1" stop-color="#DFCDB2"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c)">
