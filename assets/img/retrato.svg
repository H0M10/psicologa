    <path d="M400 530c-146 0-264 108-264 242v228H664V772c0-134-118-242-264-242Z" fill="#2F6F73"/>
    <path d="M400 530c-146 0-264 108-264 242v228h264Z" fill="#28605F"/>

    <!-- Arcos decorativos -->
